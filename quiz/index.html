<body>
<header class="topbar"><div class="topbar-main"><div class="brand"><h1>硬件安全刷题</h1><div id="modeSummary">加载题库中…</div></div><button id="settingsBtn" type="button" aria-haspopup="dialog">⚙ 设置</button></div><div class="session-line"><span id="headerProgress">准备中</span><span>正确率 <b id="headerRate">–</b></span><span>错题 <b id="headerWrong">0</b></span></div><div class="progress-track"><div id="progressFill"></div></div></header>
<main><section id="quiz" style="display:none"><article class="card" id="questionCard"><div class="question-meta"><div id="pos"></div><span class="badge type" id="typeBadge"></span></div><div class="badges" id="badges"></div><p id="stem"></p><div id="opts"></div><div id="actionBar"><button id="submitBtn" type="button" disabled>确认答案</button><button id="nextBtn" type="button" style="display:none">下一题</button></div><div id="feedback"></div></article></section><section id="summary" class="card"></section></main>
<div class="modal" id="settingsModal" aria-hidden="true"><div class="modal-backdrop" id="settingsBackdrop"></div><section class="settings-panel" role="dialog" aria-modal="true" aria-labelledby="settingsTitle"><div class="settings-head"><h2 id="settingsTitle">刷题设置</h2><button id="closeSettings" type="button" aria-label="关闭设置">×</button></div><div class="settings-body"><div class="settings-group"><h3>刷题范围</h3><div class="form-grid"><div class="field full"><label for="bank">题库</label><select id="bank"></select></div><div class="field full"><label for="mode">刷题模式</label><select id="mode"><option value="rand">随机刷题（优先新题）</option><option value="seq">顺序刷题</option><option value="wrong">错题重刷</option></select></div><div class="field"><label for="domain">知识域</label><select id="domain"><option value="">全部知识域</option></select></div><div class="field"><label for="qtype">题型</label><select id="qtype"><option value="">全部题型</option><option>单选</option><option>多选</option></select></div><div class="field"><label for="diff">层级</label><select id="diff"><option value="">全部层级</option><option>核心</option><option>扩展</option></select></div><div class="field"><label for="themeChoice">主题</label><select id="themeChoice"><option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select></div></div></div><div class="settings-group"><h3>答题偏好</h3><div class="toggle-row"><div class="toggle-copy"><strong>选项乱序</strong><small>每次出题随机排列，提交后显示原始字母</small></div><label class="switch"><input id="shuffleOptions" type="checkbox" checked><span></span></label></div><div class="toggle-row"><div class="toggle-copy"><strong>单选点击即判定</strong><small>关闭时可修改选择，再点击确认</small></div><label class="switch"><input id="singleInstant" type="checkbox"><span></span></label></div><div class="toggle-row"><div class="toggle-copy"><strong>答对后自动下一题</strong><small>短暂停留后继续；答错时仍显示解析</small></div><label class="switch"><input id="autoNext" type="checkbox"><span></span></label></div><p class="keyboard-hint">电脑快捷键：数字 1–7 选择，Enter 确认或进入下一题。</p></div><div class="settings-group"><h3>数据管理</h3><div class="data-row"><span>当前题库记录</span><span>已刷 <b id="settingsSeen">0</b> · 错题 <b id="settingsWrong">0</b></span></div><div class="danger-actions"><button id="clearSeen" type="button">清空刷题记录</button><button id="clearWrong" type="button">清空错题本</button></div></div></div><div class="settings-actions"><span class="settings-note">应用设置后将重新开始本轮</span><button id="cancelSettings" type="button">取消</button><button id="applySettings" class="primary" type="button">应用并重新开始</button></div></section></div>
<script>
const BANK_SOURCES=[{name:"硬件安全题库2",file:"../硬件安全题库2.csv"},{name:"硬件安全题库",file:"../硬件安全题库.csv"}],BANKS={},$=id=>document.getElementById(id);
function parseCSV(text){if(text.charCodeAt(0)===0xFEFF)text=text.slice(1);const rows=[];let row=[],field="",inQuotes=false;const endRow=()=>{row.push(field);field="";if(row.length>1||row[0]!=="")rows.push(row);row=[]};for(let i=0;i<text.length;i++){const c=text[i];if(inQuotes){if(c==='"'){if(text[i+1]==='"'){field+='"';i++}else inQuotes=false}else field+=c}else if(c==='"')inQuotes=true;else if(c===","){row.push(field);field=""}else if(c==="\r"){if(text[i+1]==="\n")i++;endRow()}else if(c==="\n")endRow();else field+=c}if(field!==""||row.length>0)endRow();return rows}
function csvToQuestions(text){const rows=parseCSV(text),col={};rows[0].forEach((name,i)=>{if(!(name in col))col[name]=i});const get=(row,name)=>col[name]!=null&&row[col[name]]!=null?row[col[name]]:"";return rows.slice(1).map(row=>({id:get(row,"题号"),type:get(row,"题型"),domain:get(row,"知识域"),diff:get(row,"难度"),stem:get(row,"题干"),opts:"ABCDEFG".split("").map(L=>get(row,"选项"+L)),ans:get(row,"答案"),exp:get(row,"解析"),tag:get(row,"考点")})).filter(q=>q.id&&q.stem)}
async function loadBanks(){for(const src of BANK_SOURCES){const res=await fetch(src.file,{cache:"no-cache"});if(!res.ok)throw new Error("加载 "+src.file+" 失败（HTTP "+res.status+"）");const questions=csvToQuestions(await res.text());if(!questions.length)throw new Error("题库 "+src.name+" 未解析到题目");BANKS[src.name]={questions}}}
const defaultPrefs={bank:BANK_SOURCES[0].name,mode:"rand",domain:"",qtype:"",diff:"",shuffleOptions:true,singleInstant:false,autoNext:false,theme:"system"};let prefs={...defaultPrefs},bankKey=defaultPrefs.bank,QUESTIONS=[],wrongBook=new Set,seen=new Set,queue=[],idx=0,picked=new Set,submitted=false,stats={answered:0,correct:0,score:0},autoNextTimer=null;
function parseStoredJSON(key,fallback){try{return JSON.parse(localStorage.getItem(key)||JSON.stringify(fallback))}catch(e){return fallback}}function storageKey(kind,bank=bankKey){return"hwsec_"+kind+"_v2_"+bank}function saveWrong(){localStorage.setItem(storageKey("wrong"),JSON.stringify([...wrongBook]));updateRecordCounts()}function saveSeen(){localStorage.setItem(storageKey("seen"),JSON.stringify([...seen]));updateRecordCounts()}function loadRecords(){wrongBook=new Set(parseStoredJSON(storageKey("wrong"),[]));seen=new Set(parseStoredJSON(storageKey("seen"),[]));updateRecordCounts()}function updateRecordCounts(){$("headerWrong").textContent=wrongBook.size;$("settingsSeen").textContent=seen.size;$("settingsWrong").textContent=wrongBook.size}function savePrefs(){localStorage.setItem("hwsec_prefs_v3",JSON.stringify(prefs))}function loadPrefs(){prefs={...defaultPrefs,...parseStoredJSON("hwsec_prefs_v3",{})};if(!BANKS[prefs.bank])prefs.bank=defaultPrefs.bank;if(!["rand","seq","wrong"].includes(prefs.mode))prefs.mode="rand";if(!["system","light","dark"].includes(prefs.theme))prefs.theme=localStorage.getItem("theme")||"system"}
function applyTheme(choice){if(choice==="system"){delete document.documentElement.dataset.theme;localStorage.removeItem("theme")}else{document.documentElement.dataset.theme=choice;localStorage.setItem("theme",choice)}const dark=choice==="dark"||(choice==="system"&&matchMedia("(prefers-color-scheme: dark)").matches);$("themeColor").content=dark?"#1d2026":"#ffffff"}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function buildPool(){let pool=QUESTIONS.filter(q=>(!prefs.domain||q.domain===prefs.domain)&&(!prefs.qtype||q.type===prefs.qtype)&&(!prefs.diff||q.diff===prefs.diff));if(prefs.mode==="wrong")pool=pool.filter(q=>wrongBook.has(q.id));if(prefs.mode==="rand"){shuffle(pool);pool=pool.filter(q=>!seen.has(q.id)).concat(pool.filter(q=>seen.has(q.id)))}return pool}
function modeText(){const mode={rand:"随机",seq:"顺序",wrong:"错题"}[prefs.mode],scope=[prefs.domain,prefs.qtype,prefs.diff].filter(Boolean).join(" · ")||"全部题目";return mode+" · "+scope}function renderHeader(done=false){$("modeSummary").textContent=modeText();const total=queue.length;$("headerProgress").textContent=done?"本轮完成":total?"第 "+(idx+1)+" / "+total+" 题":"暂无题目";$("headerRate").textContent=stats.answered?Math.round(stats.correct/stats.answered*100)+"%":"–";$("headerWrong").textContent=wrongBook.size;$("progressFill").style.width=(done?100:total?stats.answered/total*100:0)+"%"}
function start(options={}){clearTimeout(autoNextTimer);bankKey=prefs.bank;QUESTIONS=BANKS[bankKey].questions;loadRecords();queue=buildPool();idx=0;stats={answered:0,correct:0,score:0};$("summary").style.display="none";if(!queue.length){$("quiz").style.display="none";const s=$("summary");s.style.display="block";s.replaceChildren();const title=document.createElement("h2");title.textContent="没有符合条件的题目";const copy=document.createElement("div");copy.className="nums";copy.textContent=prefs.mode==="wrong"?"错题本是空的，先去刷题吧。":"请在设置中调整刷题范围。";const actions=document.createElement("div");actions.className="summary-actions";const button=document.createElement("button");button.textContent="调整设置";button.onclick=openSettings;actions.appendChild(button);s.append(title,copy,actions);renderHeader()}else{$("quiz").style.display="block";render()}if(options.scroll!==false)window.scrollTo({top:0,behavior:"smooth"})}
function render(){clearTimeout(autoNextTimer);const q=queue[idx];picked=new Set;submitted=false;$("questionCard").classList.remove("submitted");$("pos").textContent="第 "+(idx+1)+" / "+queue.length+" 题";$("typeBadge").textContent=q.type;$("badges").replaceChildren();[q.domain,q.diff].filter(Boolean).forEach((value,i)=>{const badge=document.createElement("span");badge.className="badge"+(i===1?" diff-"+value:"");badge.textContent=value;$("badges").appendChild(badge)});$("stem").textContent=q.stem;const items=q.opts.map((opt,i)=>({opt,orig:String.fromCharCode(65+i)})).filter(item=>item.opt);if(prefs.shuffleOptions)shuffle(items);const box=$("opts");box.replaceChildren();items.forEach((item,displayIndex)=>{const button=document.createElement("button");button.type="button";button.className="opt "+(q.type==="单选"?"single":"multiple");button.dataset.orig=item.orig;button.dataset.index=displayIndex;const marker=document.createElement("span");marker.className="choice-mark";const copy=document.createElement("span");copy.className="option-copy";const letter=document.createElement("span");letter.className="letter";letter.textContent=item.orig+".";copy.append(letter,document.createTextNode(item.opt));button.append(marker,copy);button.onclick=()=>pick(item.orig,button);box.appendChild(button)});$("feedback").style.display="none";$("feedback").replaceChildren();$("submitBtn").style.display="inline-block";$("submitBtn").disabled=true;$("nextBtn").style.display="none";renderHeader()}
function pick(letter,button){if(submitted)return;const q=queue[idx];if(q.type==="单选"){picked=new Set([letter]);document.querySelectorAll(".opt").forEach(o=>o.classList.remove("sel"));button.classList.add("sel");$("submitBtn").disabled=false;if(prefs.singleInstant)submit()}else{if(picked.has(letter)){picked.delete(letter);button.classList.remove("sel")}else{picked.add(letter);button.classList.add("sel")}$("submitBtn").disabled=picked.size===0}}
function submit(){if(submitted||!picked.size)return;const q=queue[idx],ansSet=new Set(q.ans.split("")),isRight=picked.size===ansSet.size&&[...picked].every(x=>ansSet.has(x)),wasWrong=wrongBook.has(q.id);submitted=true;stats.answered++;seen.add(q.id);if(isRight){stats.correct++;stats.score+=q.type==="单选"?2:3;wrongBook.delete(q.id)}else wrongBook.add(q.id);saveSeen();saveWrong();$("questionCard").classList.add("submitted");document.querySelectorAll(".opt").forEach(option=>{const letter=option.dataset.orig;option.classList.add("disabled");option.disabled=true;if(ansSet.has(letter))option.classList.add("right");else if(picked.has(letter))option.classList.add("wrongpick")});renderFeedback(q,isRight,wasWrong);$("submitBtn").style.display="none";const next=$("nextBtn");next.style.display="inline-block";next.textContent=idx+1>=queue.length?"查看成绩":"下一题";renderHeader();if(isRight&&prefs.autoNext&&idx+1<queue.length)autoNextTimer=setTimeout(nextQuestion,850)}
function renderFeedback(q,isRight,wasWrong){const feedback=$("feedback");feedback.replaceChildren();feedback.style.display="block";const result=document.createElement("div");result.className="result-box "+(isRight?"ok":"bad");const verdict=document.createElement("div");verdict.className="verdict";verdict.textContent=isRight?"回答正确":"回答错误";const answer=document.createElement("div");answer.className="answer-line";answer.textContent=isRight?(wasWrong?"正确答案："+q.ans+" · 已从错题本移除":"正确答案："+q.ans):"正确答案："+q.ans+(wasWrong?" · 仍保留在错题本":" · 已加入错题本");result.append(verdict,answer);const explanation=document.createElement("section");explanation.className="explanation";const heading=document.createElement("h2");heading.textContent="解析";const paragraph=document.createElement("p");paragraph.textContent=q.exp||"暂无解析。";explanation.append(heading,paragraph);feedback.append(result,explanation);if(q.tag){const knowledge=document.createElement("div");knowledge.className="knowledge";const label=document.createElement("strong");label.textContent="考点";const value=document.createElement("span");value.textContent=q.tag;knowledge.append(label,value);feedback.appendChild(knowledge)}}
function nextQuestion(){clearTimeout(autoNextTimer);idx++;if(idx>=queue.length)summary();else{render();requestAnimationFrame(()=>$("questionCard").scrollIntoView({behavior:"smooth",block:"start"}))}}
function summary(){$("quiz").style.display="none";const s=$("summary");s.style.display="block";s.replaceChildren();const rate=stats.answered?Math.round(stats.correct/stats.answered*100):0,title=document.createElement("h2");title.textContent="本轮完成";const nums=document.createElement("div");nums.className="nums";nums.innerHTML="已答 "+stats.answered+" 题 · 答对 "+stats.correct+" 题<br>正确率 "+rate+"% · 模拟得分 "+stats.score+" 分<br>错题本现有 "+wrongBook.size+" 题";const actions=document.createElement("div");actions.className="summary-actions";const again=document.createElement("button");again.textContent="按当前设置再刷一轮";again.onclick=start;const wrong=document.createElement("button");wrong.className="red";wrong.textContent="重刷错题本";wrong.onclick=()=>{prefs.mode="wrong";savePrefs();start()};actions.append(again,wrong);s.append(title,nums,actions);renderHeader(true);window.scrollTo({top:0,behavior:"smooth"})}
function refreshDomainSelect(bank,selected=""){const questions=BANKS[bank]?BANKS[bank].questions:[],domains=[...new Set(questions.map(q=>q.domain).filter(Boolean))].sort();$("domain").replaceChildren();const all=document.createElement("option");all.value="";all.textContent="全部知识域";$("domain").appendChild(all);domains.forEach(domain=>{const option=document.createElement("option");option.value=domain;option.textContent=domain;$("domain").appendChild(option)});$("domain").value=domains.includes(selected)?selected:""}
function setSettingsFields(){$("bank").value=prefs.bank;$("mode").value=prefs.mode;refreshDomainSelect(prefs.bank,prefs.domain);$("qtype").value=prefs.qtype;$("diff").value=prefs.diff;$("shuffleOptions").checked=prefs.shuffleOptions;$("singleInstant").checked=prefs.singleInstant;$("autoNext").checked=prefs.autoNext;$("themeChoice").value=prefs.theme;updateSettingsRecordCounts()}function updateSettingsRecordCounts(){const selectedBank=$("bank").value||bankKey;$("settingsSeen").textContent=new Set(parseStoredJSON(storageKey("seen",selectedBank),[])).size;$("settingsWrong").textContent=new Set(parseStoredJSON(storageKey("wrong",selectedBank),[])).size}function openSettings(){setSettingsFields();$("settingsModal").classList.add("open");$("settingsModal").setAttribute("aria-hidden","false");document.body.classList.add("modal-open");$("closeSettings").focus()}function closeSettings(){$("settingsModal").classList.remove("open");$("settingsModal").setAttribute("aria-hidden","true");document.body.classList.remove("modal-open");$("settingsBtn").focus()}function applySettings(){prefs={bank:$("bank").value,mode:$("mode").value,domain:$("domain").value,qtype:$("qtype").value,diff:$("diff").value,shuffleOptions:$("shuffleOptions").checked,singleInstant:$("singleInstant").checked,autoNext:$("autoNext").checked,theme:$("themeChoice").value};savePrefs();applyTheme(prefs.theme);closeSettings();start()}
function clearSelectedRecord(kind){const selectedBank=$("bank").value,values=new Set(parseStoredJSON(storageKey(kind,selectedBank),[]));if(!values.size)return;const label=kind==="seen"?"刷题记录":"错题本";if(!confirm("确定清空“"+selectedBank+"”的全部"+label+"？"))return;localStorage.setItem(storageKey(kind,selectedBank),"[]");if(selectedBank===bankKey){if(kind==="seen")seen.clear();else wrongBook.clear();updateRecordCounts();renderHeader(idx>=queue.length&&queue.length>0)}updateSettingsRecordCounts()}
$("submitBtn").onclick=submit;$("nextBtn").onclick=nextQuestion;$("settingsBtn").onclick=openSettings;$("closeSettings").onclick=closeSettings;$("cancelSettings").onclick=closeSettings;$("settingsBackdrop").onclick=closeSettings;$("applySettings").onclick=applySettings;$("bank").onchange=()=>{refreshDomainSelect($("bank").value);updateSettingsRecordCounts()};$("clearSeen").onclick=()=>clearSelectedRecord("seen");$("clearWrong").onclick=()=>clearSelectedRecord("wrong");document.addEventListener("keydown",event=>{if($("settingsModal").classList.contains("open")){if(event.key==="Escape")closeSettings();return}if(["INPUT","SELECT","TEXTAREA"].includes(document.activeElement.tagName)||!$("quiz").offsetParent)return;if(/^[1-7]$/.test(event.key)&&!submitted){const option=document.querySelectorAll(".opt")[Number(event.key)-1];if(option){event.preventDefault();option.click()}}else if(event.key==="Enter"){event.preventDefault();if(submitted)nextQuestion();else if(picked.size)submit()}});matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{if(prefs.theme==="system")applyTheme("system")});
(async function init(){$("settingsBtn").disabled=true;$("summary").style.display="block";$("summary").innerHTML="<h2>题库加载中…</h2>";try{await loadBanks()}catch(error){$("summary").innerHTML="<h2>题库加载失败</h2><div class='nums'>"+error.message+"<br>直接双击打开会被浏览器拦截，无法读取本地 CSV。<br>请在“硬件安全刷题”目录启动本地 Web 服务后访问 quiz/。</div>";return}Object.keys(BANKS).forEach(name=>{const option=document.createElement("option");option.value=name;option.textContent=name;$("bank").appendChild(option)});loadPrefs();applyTheme(prefs.theme);$("settingsBtn").disabled=false;start({scroll:false})})();
</script>
