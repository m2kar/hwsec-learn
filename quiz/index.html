<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>硬件安全刷题</title>
<script>(function(){var t=null;try{t=localStorage.getItem("theme")}catch(e){}if(!t)t=window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.dataset.theme=t;})();</script>
<style>
:root { --accent:#C7000B; --accentT:#C7000B; --blue:#1F4E79; --bg:#f7f5f2; --card:#fff; --text:#222; --muted:#666; --line:#e3e0dc; --optbg:#fafaf8; --selbg:#eef4fa; --okbg:#eef8f0; --okline:#2e8b57; --badbg:#fdf0ef; --badgebg:#f0ece8; --badgetext:#666; --warnbg:#fff3e0; --warntext:#b26a00; color-scheme:light; }
:root[data-theme="dark"] { --accent:#e5483d; --accentT:#ff6b60; --blue:#8ab8e8; --bg:#14161a; --card:#1d2026; --text:#d6d3cd; --muted:#9a968f; --line:#34383f; --optbg:#23262c; --selbg:#20304a; --okbg:#1d3226; --okline:#4caf7d; --badbg:#3a2020; --badgebg:#2a2d33; --badgetext:#9a968f; --warnbg:#382c16; --warntext:#d8a04a; color-scheme:dark; }
* { box-sizing:border-box; }
body { margin:0; font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif; background:var(--bg); color:var(--text); }
header { position:relative; background:var(--card); border-bottom:3px solid var(--accent); padding:14px 20px; }
h1 { margin:0 0 8px; font-size:20px; color:var(--accentT); }
#themeBtn { position:absolute; top:14px; right:20px; font-size:12px; padding:5px 12px; border:1px solid var(--line); border-radius:14px; background:var(--optbg); color:var(--text); cursor:pointer; }
#stats { font-size:13px; color:var(--muted); display:flex; gap:16px; flex-wrap:wrap; }
#stats b { color:var(--blue); }
#controls { display:flex; gap:10px; flex-wrap:wrap; align-items:center; padding:12px 20px; background:var(--card); border-bottom:1px solid var(--line); }
#controls select, #controls button { font-size:13px; padding:6px 10px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--text); }
#controls button { cursor:pointer; }
#controls .primary { background:var(--accent); color:#fff; border-color:var(--accent); }
#controls .ghost { color:var(--muted); border:none; background:none; text-decoration:underline; }
main { max-width:760px; margin:20px auto; padding:0 16px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:18px 20px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
.badges { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
.badge { font-size:12px; padding:2px 8px; border-radius:10px; background:var(--badgebg); color:var(--badgetext); }
.badge.type { background:var(--badgebg); color:var(--accentT); font-weight:600; }
.badge.diff-挑战 { background:var(--warnbg); color:var(--warntext); }
#pos { font-size:12px; color:var(--muted); margin-bottom:6px; }
#stem { font-size:16px; line-height:1.6; margin:0 0 14px; font-weight:600; }
.opt { display:block; width:100%; text-align:left; margin:8px 0; padding:10px 12px; border:1.5px solid var(--line); border-radius:8px; background:var(--optbg); color:var(--text); font-size:14.5px; line-height:1.5; cursor:pointer; }
.opt:hover { border-color:var(--muted); }
.opt.sel { border-color:var(--blue); background:var(--selbg); }
.opt.right { border-color:var(--okline); background:var(--okbg); }
.opt.wrongpick { border-color:var(--accent); background:var(--badbg); }
.opt.disabled { cursor:default; }
.letter { font-weight:700; margin-right:6px; color:var(--blue); }
#feedback { margin-top:14px; padding:12px 14px; border-radius:8px; font-size:14px; line-height:1.7; display:none; }
#feedback.ok { background:var(--okbg); border-left:4px solid var(--okline); }
#feedback.bad { background:var(--badbg); border-left:4px solid var(--accent); }
#feedback .verdict { font-weight:700; }
#exp { margin-top:8px; color:var(--text); }
#nav { display:flex; gap:10px; margin-top:16px; }
#nav button { font-size:14px; padding:9px 22px; border-radius:8px; border:none; cursor:pointer; }
#submit { background:var(--blue); color:#fff; }
#next { background:var(--accent); color:#fff; }
#summary { text-align:center; padding:34px 20px; }
#summary h2 { color:var(--accentT); }
#summary .nums { font-size:15px; line-height:2; color:var(--text); }
#summary button { margin:8px; font-size:14px; padding:9px 20px; border:none; border-radius:8px; background:var(--blue); color:#fff; cursor:pointer; }
#summary button.red { background:var(--accent); }
.hint { font-size:12px; color:var(--muted); margin-top:10px; }
</style>
</head>
<body>
<header>
  <h1>硬件安全刷题</h1>
  <div id="stats">
    <span>本次已答 <b id="stAnswered">0</b></span>
    <span>答对 <b id="stCorrect">0</b></span>
    <span>正确率 <b id="stRate">–</b></span>
    <span>模拟得分 <b id="stScore">0</b> 分</span>
    <span>已刷 <b id="stSeen">0</b>/<b id="stTotal">300</b> 题</span>
    <span>错题本 <b id="stWrong">0</b></span>
    <button id="themeBtn" title="切换深色 / 浅色（默认跟随系统）">☾ 深色</button>
  </div>
</header>
<div id="controls">
  <select id="bank" aria-label="选择题库"></select>
  <select id="mode">
    <option value="rand" selected>随机刷题（优先新题）</option>
    <option value="seq">顺序刷题</option>
    <option value="wrong">错题重刷</option>
  </select>
  <select id="domain"><option value="">全部知识域</option></select>
  <select id="qtype"><option value="">全部题型</option><option>单选</option><option>多选</option></select>
  <select id="diff"><option value="">全部层级</option><option>核心</option><option>扩展</option></select>
  <button id="startBtn" class="primary">开始 / 重置</button>
  <button id="clearSeen" class="ghost">清空刷题记录</button>
  <button id="clearWrong" class="ghost">清空错题本</button>
</div>
<main>
  <div id="quiz" style="display:none">
    <div class="card">
      <div id="pos"></div>
      <div class="badges" id="badges"></div>
      <p id="stem"></p>
      <div id="opts"></div>
      <div id="feedback"></div>
      <div class="hint" id="hint"></div>
    </div>
    <div id="nav">
      <button id="submitBtn">确认答案</button>
      <button id="nextBtn" style="display:none">下一题</button>
    </div>
  </div>
  <div id="summary" class="card" style="display:none"></div>
</main>

础", "stem": "同时提供机密性与完整性保护的认证加密（AEAD）模式是？", "opts": ["ECB", "CBC", "GCM", "OFB", "", "", ""], "ans": "C", "exp": "GCM 由 CTR 加密与 GHASH 认证组成、是 TLS 等协议主流的 AEAD 方案；注意其 nonce 重用会导致认证密钥泄漏。", "tag": "AEAD"}, {"id": "Q007", "type": "单选", "domain": "密码算法", "diff": "基础", "stem": "MD5 的输出长度是？", "opts": ["96 位", "128 位", "160 位", "256 位", "", "", ""], "ans": "B", "exp": "MD5 输出 128 位；其抗碰撞性已被攻破（王小云等 2004 年提出碰撞方法、Flame 恶意软件 2012 年实际利用 chosen-prefix 碰撞伪造签名）。", "tag": "MD5"}, {"id": "Q008", "type": "单选", "domain": "密码算法", "diff": "进阶", "stem": "标志着 SHA-1 被实际攻破的研究是？", "opts": ["RSA-155 分解", "SHAttered 碰撞", "Logjam 降级攻击", "ROCA 缺陷", "", "", ""], "ans": "B", "exp": "2017 年 Google 与 CWI 完成 SHA-1 首例实际碰撞（SHAttered）、2020 年 Shambles 进一步给出 chosen-prefix 碰撞；此后主流浏览器与 CA 全面弃用 SHA-1 证书。", "tag": "SHA-1"}, {"id": "Q009", "type": "单选", "domain": "密码算法", "diff": "基础", "stem": "RSA 算法的安全性基于哪个数学难题？", "opts": ["模乘离散对数", "大整数分解", "椭圆曲线离散对数", "格上最短向量", "", "", ""], "ans": "B", "exp": "RSA 基于大整数分解；DH/DSA 基于模乘离散对数、ECC 基于椭圆曲线离散对数——Shor 算法会让这三类问题全部失效。", "tag": "RSA"}, {"id": "Q010", "type": "单选", "domain": "密码算法", "diff": "基础", "stem": "与 RSA-3072 安全强度相当的 ECC 密钥长度约为？", "opts": ["128 位", "160 位", "256 位", "512 位", "", "", ""], "ans": "C", "exp": "ECC 单位密钥强度更高：256 位椭圆曲线约等效 3072 位 RSA（128 位安全强度）；这也是 TLS 证书普遍采用 P-256/X25519 的原因。", "tag": "ECC"}, {"id": "Q011", "type": "单选", "domain": "密码算法", "diff": "基础", "stem": "SM2 是什么类型的密码算法？", "opts": ["基于 256 位椭圆曲线的公钥算法", "128 位分组密码", "杂凑算法", "流密码", "", "", ""], "ans": "A", "exp": "SM2 为国密椭圆曲线公钥算法（GB/T 32918）、提供加密、签名与密钥交换；量子威胁与 ECC 相同。", "tag": "SM2"}, {"id": "Q012", "type": "单选", "domain": "密码算法", "diff": "进阶", "stem": "SM9 与 SM2 最大的区别是？", "opts": ["SM9 基于大整数分解", "SM9 是标识密码（IBC）、公钥可以是身份标识", "SM9 是流密码", "SM9 只能加密不能签名", "", "", ""], "ans": "B", "exp": "SM9 为标识密码算法、直接用手机号或邮箱等身份串作为公钥、无需证书体系、基于双线性对构造（GM/T 0044）。", "tag": "SM9"}, {"id": "Q013", "type": "单选", "domain": "密码算法", "diff": "基础", "stem": "下列安全属性中、只有数字签名能提供的是？", "opts": ["机密性", "完整性", "认证", "不可否认性", "", "", ""], "ans": "D", "exp": "MAC/HMAC 也能提供完整性与认证、但双方持有同一密钥、无法向第三方证明是谁生成的；签名用私钥生成、公钥可公开验证、因此具备不可否认性。", "tag": "数字签名"}, {"id": "Q014", "type": "单选", "domain": "密码算法", "diff": "进阶", "stem": "RSA 加密的推荐填充方案是？", "opts": ["PKCS#1 v1.5 旧填充", "OAEP", "PSS", "不填充", "", "", ""], "ans": "B", "exp": "教科书式 RSA 是确定性的且易受选择密文攻击；实际加密必须用 OAEP、签名用 PSS。", "tag": "RSA 填充"}, {"id": "Q015", "type": "单选", "domain": "密码算法", "diff": "进阶", "stem": "ECDSA 签名随机数 k 被重用或泄漏的直接后果是？", "opts": ["签名变慢", "单次签名失败", "私钥可被直接恢复", "公钥泄漏", "", "", ""], "ans": "C", "exp": "由两条签名的差分可解出 k、进而恢复私钥；PS3 被破解正是源于固定 k。缓解办法是 RFC 6979 确定性 nonce。", "tag": "ECDSA"}, {"id": "Q016", "type": "单选", "domain": "密码算法", "diff": "基础", "stem": "HMAC 与普通哈希（如 SHA-256）的本质区别是？", "opts": ["输出更短", "引入密钥参与运算", "不需要输入数据", "抗碰撞更强", "", "", ""], "ans": "B", "exp": "MAC 用密钥构造、提供完整性与认证但无不可否认性；HMAC 基于哈希构造、CMAC 基于分组密码构造。", "tag": "MAC"}, {"id": "Q017", "type": "单选", "domain": "密码算法", "diff": "基础", "stem": "对现有公钥密码（RSA/ECC）构成根本威胁的量子算法是？", "opts": ["Grover", "Shor", "BHT", "Diffie-Hellman 扩展", "", "", ""], "ans": "B", "exp": "Shor 算法在多项式时间求解大整数分解与离散对数、使 RSA/DSA/DH/ECC 全部失效；Grover 只给搜索平方加速、对称算法加长密钥即可应对。", "tag": "量子威胁"}, {"id": "Q018", "type": "单选", "domain": "密码算法", "diff": "进阶", "stem": "Grover 算法对 AES-128 的影响是？", "opts": ["完全攻破", "有效强度降至约 64 位", "无影响", "密钥长度自动减半", "", "", ""], "ans": "B", "exp": "Grover 只提供平方加速、AES-128 的量子安全强度约剩 2^64、已不足；后量子时代推荐 AES-256（约 2^128）。", "tag": "Grover"}, {"id": "Q019", "type": "单选", "domain": "密码算法", "diff": "进阶", "stem": "NIST 首批后量子标准中的 ML-KEM（FIPS 203）源自哪个算法、属于什么类型？", "opts": ["SPHINCS+ / 数字签名", "CRYSTALS-Kyber / 密钥封装（KEM）", "Falcon / 数字签名", "Classic McEliece / 数字签名", "", "", ""], "ans": "B", "exp": "FIPS 203 即 ML-KEM（源于 Kyber、格上构造）；FIPS 204 为 ML-DSA（Dilithium 签名）、FIPS 205 为 SLH-DSA（SPHINCS+ 签名）。", "tag": "ML-KEM"}, {"id": "Q020", "type": "单选", "domain": "密码算法", "diff": "挑战", "stem": "同源（Isogeny）路线代表算法 SIKE 被经典计算机攻破（2022 年）说明什么？", "opts": ["格密码同样不安全", "新的数学假设必须经过充分密码分析才能进入标准", "通用量子计算机已经问世", "哈希签名已被攻破", "", "", ""], "ans": "B", "exp": "Castryck 与 Decru 用普通计算机攻破 SIKE、说明未经充分审查的新数学假设风险很高；这也是 NIST 同时标准化的多条路线并选择 HQC 作为异构备份的原因。", "tag": "SIKE"}, {"id": "Q021", "type": "单选", "domain": "同态加密", "diff": "进阶", "stem": "提出首个全同态加密（FHE）构造并引入自举（bootstrapping）思想的学者是？", "opts": ["Shor", "Gentry", "Paillier", "Rivest", "", "", ""], "ans": "B", "exp": "Gentry 于 2009 年基于理想格给出首个 FHE 构造；Paillier 只是加法同态的部分同态方案。", "tag": "FHE"}, {"id": "Q022", "type": "单选", "domain": "同态加密", "diff": "进阶", "stem": "面向 AI 推理、支持近似实数向量运算的 FHE 方案族是？", "opts": ["BGV", "BFV", "CKKS", "TFHE", "", "", ""], "ans": "C", "exp": "CKKS 采用近似算术、天然匹配神经网络运算；BGV/BFV 面向精确整数、TFHE 面向布尔门且自举最快。", "tag": "CKKS"}, {"id": "Q023", "type": "单选", "domain": "同态加密", "diff": "挑战", "stem": "FHE 中自举（bootstrapping）的作用是？", "opts": ["生成密钥", "压缩密文", "在密文域刷新噪声、恢复同态计算能力", "加速解密", "", "", ""], "ans": "C", "exp": "同态乘法会持续增长噪声、乘法深度受限；自举通过同态执行解密电路重置噪声、但计算代价很高、也正是 FHE 硬件加速器的主要负载。", "tag": "自举"}, {"id": "Q024", "type": "单选", "domain": "同态加密", "diff": "进阶", "stem": "Paillier 密码体制的同态性质是？", "opts": ["乘法同态", "加法同态", "全同态", "无同态性", "", "", ""], "ans": "B", "exp": "Paillier 满足加法同态（密文相乘等于明文相加）、RSA 与 ElGamal 为乘法同态；两者均被 ISO/IEC 18033-6 收录。", "tag": "部分同态"}, {"id": "Q025", "type": "单选", "domain": "密码实现", "diff": "进阶", "stem": "密码算法恒定时间（constant-time）实现的核心要求是？", "opts": ["所有运算并行执行", "执行时间与内存访问模式不依赖秘密数据", "时钟频率固定不变", "必须使用专用芯片", "", "", ""], "ans": "B", "exp": "恒定时间为防时序侧信道：避免以秘密值为条件的分支与查表；AES 查表实现被缓存计时攻击是典型反例。", "tag": "恒定时间"}, {"id": "Q026", "type": "单选", "domain": "密码实现", "diff": "进阶", "stem": "TRNG 熵源评估与在线健康测试依据的核心标准是？", "opts": ["NIST SP 800-90B", "ISO/IEC 11889", "FIPS 197", "GM/T 0005", "", "", ""], "ans": "A", "exp": "SP 800-90B 规定熵源估计与在线健康测试（重复计数测试、自适应比例测试）；SP 800-22 是统计测试套件、AIS-31 是德国 BSI 的随机数评估标准。", "tag": "TRNG"}, {"id": "Q027", "type": "单选", "domain": "架构安全特性", "diff": "进阶", "stem": "x86 上由影子栈（SHSTK）与间接分支跟踪（IBT）组成的控制流强制技术是？", "opts": ["CET", "MPK", "SMEP", "TXT", "", "", ""], "ans": "A", "exp": "CET 即控制流强制技术；MPK/PKS 是页保护键、SMEP 禁止内核执行用户态页面、TXT 是 DRTM 动态度量。", "tag": "CET"}, {"id": "Q028", "type": "单选", "domain": "架构安全特性", "diff": "进阶", "stem": "RISC-V 标量加密扩展中、对应国密 SM4 与 SM3 的扩展分别是？", "opts": ["Zkne 与 Zknh", "Zksed 与 Zksh", "Zbkb 与 Zbkc", "Zknd 与 Zknh", "", "", ""], "ans": "B", "exp": "Zksed/Zksh 即 SM4 分组密码与 SM3 杂凑指令；Zkne/Zknd/Zknh 对应 AES 与 SHA-2——国密算法已进入 RISC-V 标准扩展。", "tag": "Zk 扩展"}, {"id": "Q029", "type": "单选", "domain": "侧信道攻击", "diff": "基础", "stem": "SPA（简单功耗分析）最典型的攻击对象是？", "opts": ["AES 的 S 盒运算", "RSA 的平方-乘法操作序列", "SHA-3 的海绵结构", "SM4 的轮密钥加", "", "", ""], "ans": "B", "exp": "RSA 指数的每个比特决定当轮执行平方还是乘法、在单条功耗曲线上形态可辨、因此无需统计即可读出私钥；缓解为恒定时间模幂与指数盲化。", "tag": "SPA"}, {"id": "Q030", "type": "单选", "domain": "侧信道攻击", "diff": "基础", "stem": "抵御 DPA 的主流实现级手段是？", "opts": ["增加密钥长度", "换用 RSA 算法", "掩码（Masking）", "提高时钟频率", "", "", ""], "ans": "C", "exp": "掩码把秘密拆成多份共享分别处理；隐藏（加噪、乱序、双轨逻辑）是另一条路线——两者常组合使用并显著增加面积与性能开销。", "tag": "DPA 防护"}, {"id": "Q031", "type": "单选", "domain": "侧信道攻击", "diff": "基础", "stem": "激光故障注入在攻击分类中属于？", "opts": ["非侵入", "半侵入", "侵入", "远程攻击", "", "", ""], "ans": "B", "exp": "激光注入需要开封去封装但不接触或修改电路、属于半侵入；空间与时间精度最高、可翻转 SRAM 单比特或跳过单条指令。", "tag": "故障注入分类"}, {"id": "Q032", "type": "单选", "domain": "侧信道攻击", "diff": "进阶", "stem": "CPA 攻击中、假设功耗与实测曲线之间通常用什么统计量进行匹配？", "opts": ["方差", "皮尔逊相关系数", "峰度", "傅里叶幅值", "", "", ""], "ans": "B", "exp": "CPA（Brier 等、2004）以 S 盒输出的汉明重量作为假设功耗、与实测功耗计算相关系数、相关性峰值对应的子密钥猜测即正确密钥。", "tag": "CPA"}, {"id": "Q033", "type": "单选", "domain": "侧信道攻击", "diff": "进阶", "stem": "侧信道泄漏建模中的汉明距离（HD）模型适用于？", "opts": ["总线或寄存器从上一状态翻转到下一状态的场景", "静态泄漏电流", "时钟树功耗", "芯片散热", "", "", ""], "ans": "A", "exp": "HD 模型刻画前后两个状态的翻转位数（如寄存器更新、总线传输）、HW 模型刻画当前置位个数——泄漏模型选错会显著降低攻击效率。", "tag": "泄漏模型"}, {"id": "Q034", "type": "单选", "domain": "侧信道攻击", "diff": "进阶", "stem": "TVLA 的本质是？", "opts": ["一种密钥恢复攻击", "固定输入对比随机输入的 Welch t 检验泄漏评估方法", "密钥生成协议", "认证协议", "", "", ""], "ans": "B", "exp": "TVLA（Test Vector Leakage Assessment）不恢复密钥、只判定实现是否存在与密钥相关的泄漏；一阶与高阶检测分别对应无掩码与不同阶数掩码的评估。", "tag": "TVLA"}, {"id": "Q035", "type": "单选", "domain": "侧信道攻击", "diff": "进阶", "stem": "Bellcore 攻击从 RSA-CRT 错误签名恢复私钥的依据是？", "opts": ["gcd(s−s′、N) = p", "出现了新的分解算法", "私钥经侧信道泄漏", "暴力枚举成功", "", "", ""], "ans": "A", "exp": "正确签名与错误签名的差与模数 N 的最大公约数即素数 p、一次故障即可分解 N——因此 RSA-CRT 签名后必须用公钥验签。", "tag": "Bellcore"}, {"id": "Q036", "type": "单选", "domain": "侧信道攻击", "diff": "挑战", "stem": "对 AES 最后几轮注入单字节故障、利用正确与错误密文的差分恢复轮密钥的技术是？", "opts": ["差分故障分析（DFA）", "差分功耗分析（DPA）", "中间相遇攻击", "积分攻击", "", "", ""], "ans": "A", "exp": "DFA（如 Piret-Quisquater 方法）仅需少量故障即可恢复 AES-128 轮密钥；防护依赖冗余计算、校验与故障检测。", "tag": "DFA"}, {"id": "Q037", "type": "单选", "domain": "侧信道防护", "diff": "进阶", "stem": "有源屏蔽（active shield）的作用是？", "opts": ["辅助散热", "顶层金属网被探测或破坏即触发报警并清零密钥", "提高时钟精度", "降低动态功耗", "", "", ""], "ans": "B", "exp": "屏蔽网布于芯片顶层、攻击者开封后探针或激光一旦接触即触发响应——是抗侵入与激光注入的重要手段。", "tag": "有源屏蔽"}, {"id": "Q038", "type": "单选", "domain": "侧信道防护", "diff": "进阶", "stem": "冷启动攻击针对的对象是？", "opts": ["CPU 通用寄存器", "DRAM 断电后的数据残留", "Flash 磨损", "电池电路", "", "", ""], "ans": "B", "exp": "断电后立刻冷却 DRAM 可延长数据残留时间、进而读出内存中的密钥（Halderman 等、2008）；缓解包括开机内存清零、内存加密与 TPM 密封。", "tag": "冷启动"}, {"id": "Q039", "type": "单选", "domain": "硬件可信根", "diff": "基础", "stem": "安全启动与可信启动的本质区别是？", "opts": ["前者用哈希、后者用签名", "前者阻断执行、后者只记录度量", "前者必须搭配 TPM", "两者完全等价", "", "", ""], "ans": "B", "exp": "安全启动逐级验签、验不过就拒绝执行；可信启动逐级度量进 PCR、不阻断、事后通过 Quote 向远端证明系统状态。", "tag": "安全启动"}, {"id": "Q040", "type": "单选", "domain": "硬件可信根", "diff": "基础", "stem": "TPM 的 PCR 状态更新运算为？", "opts": ["直接覆盖写入", "数值累加", "PCR′ = Hash(PCR ‖ 新度量值)", "清零后重算", "", "", ""], "ans": "C", "exp": "extend 运算保证度量历史不可伪造；PCR 重启时清零、配合密封与 Quote 使用。", "tag": "PCR"}, {"id": "Q041", "type": "单选", "domain": "硬件可信根", "diff": "基础", "stem": "FIPS 140-3 中提供温度电压等环境失配防护的最高等级是？", "opts": ["Level 1", "Level 2", "Level 3", "Level 4", "", "", ""], "ans": "D", "exp": "Level 1 无物理防护要求、Level 2 要求防篡改指示（封条涂层）、Level 3 要求篡改响应清零与身份认证、Level 4 增加环境失配防护。", "tag": "FIPS 140-3"}, {"id": "Q042", "type": "单选", "domain": "硬件可信根", "diff": "进阶", "stem": "PUF 相比 OTP 存储密钥的主要优势是？", "opts": ["运算速度更快", "密钥不落入存储介质、由制造随机性现场生成、抗克隆与读取", "功耗更低", "不需要  ""], "ans": "A", "exp": "TEE.Fail 利用内存总线欠速使读数出错、从而绕过完整性校验——说明云机密计算面对强物理攻击者仍有开放问题。", "tag": "TEE.Fail"}, {"id": "Q057", "type": "单选", "domain": "微架构安全", "diff": "基础", "stem": "Meltdown 的根本原因是？", "opts": ["缓存容量过大", "分支预测错误", "乱序执行窗口内越权数据已进入缓存、而权限检查延迟到指令退休时才生效", "DRAM 电荷泄漏", "", "", ""], "ans": "C", "exp": "异常抛出前秘密数据已被缓存编码、攻击者用 Flush+Reload 逐字节恢复；缓解为 KPTI 内核页表隔离——AMD 因权限检查并行化基本免疫。", "tag": "Meltdown"}, {"id": "Q058", "type": "单选", "domain": "微架构安全", "diff": "基础", "stem": "Spectre v2 利用的微架构部件是？", "opts": ["分支目标缓冲器（BTB）", "TLB", "存储缓冲", "中断控制器", "", "", ""], "ans": "A", "exp": "Spectre v2 即分支目标注入、通过污染 BTB 引导内核推测执行攻击者选择的 gadget；v1 是边界检查绕过、v4 是推测存储绕过。", "tag": "Spectre v2"}, {"id": "Q059", "type": "单选", "domain": "微架构安全", "diff": "进阶", "stem": "缓解 Meltdown 的操作系统级措施是？", "opts": ["retpoline", "KPTI 内核页表隔离", "IBPB", "堆地址随机化", "", "", ""], "ans": "B", "exp": "KPTI（源于 KAISER）使用户态页表几乎不映射内核空间、使攻击者无地址可读；retpoline 与 IBPB 针对 Spectre v2。", "tag": "KPTI"}, {"id": "Q060", "type": "单选", "domain": "微架构安全", "diff": "进阶", "stem": "Rowhammer 属于哪一类攻击？", "opts": ["瞬态执行攻击", "DRAM 扰动故障类攻击", "网络协议攻击", "时序侧信道攻击", "", "", ""], "ans": "B", "exp": "反复高频激活同一 DRAM 行导致相邻行位翻转、本质是故障注入；缓解包括目标行刷新（TRR）与 DDR5 的 ACT-RH 计数器。", "tag": "Rowhammer"}, {"id": "Q061", "type": "单选", "domain": "微架构安全", "diff": "进阶", "stem": "需要攻击者与受害者共享物理内存页的缓存攻击原语是？", "opts": ["Prime+Probe", "Flush+Reload", "Evict+Time", "PortSmash", "", "", ""], "ans": "B", "exp": "Flush+Reload 依赖 clflush 与共享页（共享库或页面去重）、分辨率最高；Prime+Probe 无需共享内存、可跨核使用。", "tag": "缓存攻击"}, {"id": "Q062", "type": "单选", "domain": "微架构安全", "diff": "挑战", "stem": "L1TF（Foreshadow）与 Meltdown/Spectre 的关键不同在于？", "opts": ["完全不需要乱序执行", "读取页表项 present=0 时 L1 数据缓存中的陈旧数据、可穿透 SGX 与虚机隔离", "只影响 AMD 处理器", "没有任何缓解措施", "", "", ""], "ans": "B", "exp": "L1TF 利用缺页表项场景下 L1D 的残留数据、对 SGX 与云虚机威胁最大；缓解包括入口刷新 L1D 与微码更新、彻底修复需禁用超线程。", "tag": "L1TF"}, {"id": "Q063", "type": "单选", "domain": "供应链安全", "diff": "基础", "stem": "硬件木马的两个组成部分是？", "opts": ["编译器与调试器", "触发器（Trigger）与载荷（Payload）", "ROM 与 RAM", "传感 基础", "stem": "以下哪些算法或参数已不再安全、不应在新系统中使用？", "opts": ["DES", "RC4", "SHA-1", "RSA-1024", "", "", ""], "ans": "ABCD", "exp": "DES 可暴力破解、RC4 存在统计偏差、SHA-1 已被实际碰撞、RSA-1024 强度不足——全部应替换为 AES/SHA-256/RSA-3072 或 ECC-256 等。", "tag": "不再安全"}, {"id": "Q085", "type": "多选", "domain": "密码算法", "diff": "基础", "stem": "下列国密算法与国际算法的功能对应关系正确的有？", "opts": ["SM2 对应椭圆曲线公钥算法（如 ECDSA）", "SM3 对应杂凑算法（如 SHA-256）", "SM4 对应分组密码（如 AES）", "SM9 对应标识密码（IBC）", "", "", ""], "ans": "ABCD", "exp": "SM2 为 256 位椭圆曲线公钥算法、SM3 为 256 位杂凑、SM4 为 128 位分组、SM9 为基于双线性对的标识密码——四组对应均正确。", "tag": "国密算法"}, {"id": "Q086", "type": "多选", "domain": "密码算法", "diff": "基础", "stem": "数字签名可以提供的安全属性包括？", "opts": ["完整性", "认证", "不可否认性", "机密性", "", "", ""], "ans": "ABC", "exp": "签名先哈希后用私钥签署、可公开验证、因此提供完整性与认证并具备不可否认性；机密性必须由加密提供、签名本身不加密。", "tag": "数字签名"}, {"id": "Q087", "type": "多选", "domain": "密码算法", "diff": "进阶", "stem": "下列属于密码实现层面的著名事故的有？", "opts": ["Debian OpenSSL 随机数缺陷（2008）", "PS3 ECDSA 固定 k（2010）", "Infineon ROCA（2017）", "Logjam 降级攻击", "", "", ""], "ans": "ABCD", "exp": "四者分别说明随机数实现、签名 nonce、密钥生成与协议参数都可能出问题——密码实现审计需覆盖全部环节。", "tag": "实现事故"}, {"id": "Q088", "type": "多选", "domain": "密码算法", "diff": "进阶", "stem": "NIST 后量子标准中属于数字签名算法的有？", "opts": ["ML-KEM", "ML-DSA", "SLH-DSA", "HQC", "", "", ""], "ans": "BC", "exp": "ML-DSA（FIPS 204）与 SLH-DSA（FIPS 205）是签名；ML-KEM 与 HQC 是密钥封装机制（KEM）、不是签名。", "tag": "PQC 签名"}, {"id": "Q089", "type": "多选", "domain": "密码算法", "diff": "进阶", "stem": "后量子密码的主要技术路线包括当前仍然有效的？", "opts": ["格密码", "哈希签名", "纠错码", "同源（Isogeny、代表 SIKE 已被攻破）", "", "", ""], "ans": "ABC", "exp": "格（ML-KEM/ML-DSA）、哈希（SLH-DSA、LMS/XMSS）、纠错码（HQC、Classic McEliece）是当前有效路线；同源路线的 SIKE 于 2022 年被经典攻击攻破。", "tag": "PQC 路线"}, {"id": "Q090", "type": "多选", "domain": "密码算法", "diff": "进阶", "stem": "后量子密码迁移的合理措施包括？", "opts": ["采用经典与后量子混合密钥交换（如 X25519MLKEM768）", "建设密码敏捷性（crypto-agility）架构", "盘点密码资产并按数据保密周期排定迁移优先级", "立即废止全部传统算法并切断业务", "", "", ""], "ans": "ABC", "exp": "迁移遵循混合过渡、敏捷架构与资产盘点三条主线；一刀切废止传统算法会切断业务、实际路线是分阶段替换（NIST 计划 2030 年弃用、2035 年禁用 RSA-2048 与 ECC P-256）。", "tag": "后量子迁移"}, {"id": "Q091", "type": "多选", "domain": "同态加密", "diff": "进阶", "stem": "下列属于全同态加密（FHE）主流方案族的有？", "opts": ["BGV/BFV", "CKKS", "TFHE/CGGI", "Paillier", "", "", ""], "ans": "ABC", "exp": "前三者是 FHE 主流方案族；Paillier 只是加法同态的部分同态方案（ISO/IEC 18033-6 收录）。", "tag": "FHE 方案族"}, {"id": "Q092", "type": "多选", "domain": "同态加密", "diff": "进阶", "stem": "下列属于隐私计算技术栈的有？", "opts": ["全同态加密 FHE", "多方安全计算 MPC", "差分隐私 DP", "可信执行环境 TEE", "", "", ""], "ans": "ABCD", "exp": "四者是隐私计算的主要路线：FHE 密文计算、MPC 多方交互、DP 统计加噪、TEE 硬件隔离——实际系统常组合使用、如联邦学习叠加 DP 与 TEE。", "tag": "隐私计算"}, {"id": "Q093", "type": "多选", "domain": "密码实现", "diff": "进阶", "stem": "密码算法库软硬件协同设计的典型体现包括？", "opts": ["x86 AES-NI 与 ARMv8 Crypto Extensions 指令", "RISC-V Zk 标量加密扩展（含 Zksed/Zksh 国密指令）", "格密码 NTT 硬件加速器", "库层 Provider/Engine 与 SDF 接口解耦", "", "", ""], "ans": "ABCD", "exp": "协同设计覆盖指令层（AES-NI、ARMv8 CE、Zk）、加速器层（NTT）与库架构层（OpenSSL Provider、PKCS#11、国密 SDF）——目标是性能与合规兼得、且降级路径同样恒定时间。", "tag": "软硬件协同"}, {"id": "Q094", "type": "多选", "domain": "密码实现", "diff": "进阶", "stem": "恒定时间密码实现应遵守的做法包括？", "opts": ["避免以秘密数据为条件的分支", "避免以秘密数据为索引的查表访问", "密钥使用后立即清零", "RSA 私钥运算使用指数盲化", "", "", ""], "ans": "ABCD", "exp": "四项分别消除时序与缓存泄漏、残留泄漏并对抗 RSA 时序攻击——任何违反都可能被远程计时攻击利用。", "tag": "恒定时间"}, {"id": "Q095", "type": "多选", "domain": "侧信道攻击", "diff": "基础", "stem": "侧信道攻击可以利用的信息源包括？", "opts": ["功耗", "电磁辐射", "执行时间", "声学噪声", "", "", ""], "ans": "ABCD", "exp": "功耗与电磁是最主流的两类、时序可远程利用、声学（Genkin 等的 RSA 提取）与光子发射等也可行——共同点是都与秘密数据存在相关性。", "tag": "侧信道分类"}, {"id": "Q096", "type": "多选", "domain": "侧信道攻击", "diff": "基础", "stem": "侧信道防护手段包括？", "opts": ["布尔掩码", "随机乱序与加噪", "恒定时间实现", "双轨逻辑（WDDL）", "", "", ""], "ans": "ABCD", "exp": "掩码属于分而治之、乱序与加噪属于隐藏、恒定时间针对软件、WDDL 通过双轨平衡功耗——四者常按资产价值组合使用。", "tag": "侧信道防护"}, {"id": "Q097", "type": "多选", "domain": "故障注入", "diff": "基础", "stem": "下列属于故障注入手段的有？", "opts": ["电压毛刺", "时钟毛刺", "激光注入", "电磁故障注入（EMFI）", "", "", ""], "ans": "ABCD", "exp": "电压与时钟毛刺成本最低、EMFI 无需开封、激光精度最高但需开封——FIB 属于侵入式修改、一般也归入物理攻击手段。", "tag": "故障注入分类"}, {"id": "Q098", "type   if (submitted) return;
  if (!picked.size) { alert("请先选择答案"); return; }
  const q = queue[idx];
  submitted = true;
  const ansSet = new Set(q.ans.split(""));
  const isRight = picked.size === ansSet.size && [...picked].every(x => ansSet.has(x));
  stats.answered++;
  seen.add(q.id); saveSeen();
  if (isRight) {
    stats.correct++;
    stats.score += q.type === "单选" ? 2 : 3;
    if (mode === "wrong") { wrongBook.delete(q.id); }
  } else {
    wrongBook.add(q.id);
  }
  saveWrong(); renderStats();
  document.querySelectorAll(".opt").forEach(o => {
    const L = o.dataset.orig;
    o.classList.add("disabled");
    if (ansSet.has(L)) o.classList.add("right");
    else if (picked.has(L)) o.classList.add("wrongpick");
  });
  const fb = $("feedback");
  fb.className = isRight ? "ok" : "bad";
  fb.style.display = "block";
  fb.innerHTML = "<div class='verdict'>" + (isRight ? "回答正确 +" + (q.type === "单选" ? 2 : 3) + " 分"
      : "回答错误　正确答案：" + q.ans.split("").map(ch => origToDisp[ch] || ch).sort().join("") + (mode !== "wrong" ? "　（已加入错题本）" : "")) +
    "</div><div id='exp'><b>解析：</b>" + q.exp + "　<b>考点：</b>" + q.tag + "</div>";
  $("submitBtn").style.display = "none";
  const next = $("nextBtn");
  next.style.display = "inline-block";
  next.textContent = idx + 1 >= queue.length ? "查看成绩" : "下一题";
}
function summary() {
  $("quiz").style.display = "none";
  const s = $("summary");
  s.style.display = "block";
  const rate = stats.answered ? Math.round(stats.correct / stats.answered * 100) : 0;
  s.innerHTML = "<h2>本轮成绩</h2><div class='nums'>" +
    "共 " + queue.length + " 题　|　已答 " + stats.answered + " 题　|　答对 " + stats.correct + " 题<br>" +
    "正确率 " + rate + "%　|　模拟得分 " + stats.score + " 分<br>" +
    "错题本现有 " + wrongBook.size + " 题</div>" +
    "<button onclick='start()'>再刷一遍（同筛选）</button>" +
    "<button class='red' onclick='startWrong()'>重刷错题本</button>";
}
function startWrong() { $("mode").value = "wrong"; start(); }
$("submitBtn").onclick = submit;
$("nextBtn").onclick = () => { idx++; if (idx >= queue.length) summary(); else render(); };
$("startBtn").onclick = start;
$("clearWrong").onclick = () => {
  if (wrongBook.size && confirm("确定清空全部错题记录？")) { wrongBook.clear(); saveWrong(); }
};
$("clearSeen").onclick = () => {
  if (seen.size && confirm("确定清空刷题记录？之后随机模式将重新优先推送所有题目。")) { seen.clear(); saveSeen(); }
};
function effectiveTheme() {
  return document.documentElement.dataset.theme ||
    (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
}
function updateThemeBtn() {
  $("themeBtn").textContent = effectiveTheme() === "dark" ? "☀ 浅色" : "☾ 深色";
}
$("themeBtn").onclick = () => {
  const system = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  const next = effectiveTheme() === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  if (next === system) { localStorage.removeItem("theme"); delete document.documentElement.dataset.theme; }
  else { localStorage.setItem("theme", next); }
  updateThemeBtn();
};
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", updateThemeBtn);
(function init() {
  const selector = $("bank");
  Object.keys(BANKS).forEach(name => {
    const option = document.createElement("option");
    option.value = name; option.textContent = name; selector.appendChild(option);
  });
  selector.value = bankKey;
  selector.onchange = selectBank;
  refreshFilters();
  wrongBook = new Set(JSON.parse(localStorage.getItem(storageKey("wrong")) || "[]"));
  seen = new Set(JSON.parse(localStorage.getItem(storageKey("seen")) || "[]"));
  saveWrong(); saveSeen(); start(); updateThemeBtn();
})();
</script>
</body>
</html>
